# Tier 2 — thin boot gate: server up, route reachable, body rendered, no console errors,
# no crash text. Rich UX checks live in acceptance-contract.json.
name: product-passport-smoke
server:
  # `yarn next:start` is `next dev`, which compiles each route on its first
  # request — a cold API route can exceed the hydration timeout and fail the
  # gate for a reason that has nothing to do with the app. `yarn next:serve`
  # runs the production build the baseline already produced, which is also the
  # artifact actually shipped.
  command: yarn next:serve
  url: http://localhost:3000
  timeoutMs: 180000
defaults:
  timeoutMs: 60000
  hydrationTimeoutMs: 60000
  minBodyTextLength: 40
  failOnConsoleError: true
routes:
  - name: home
    path: /
  - name: verify-demo
    path: /verify/1
  - name: verify-forged
    path: /verify/2
  - name: issuer
    path: /issuer
  - name: my-passports
    path: /my-passports
  - name: index-api-products
    path: /api/passport/products
forbidden:
  visibleText:
    - "Application error"
    - "Unhandled Runtime Error"
    - "Internal Server Error"
    - "This page could not be found"
