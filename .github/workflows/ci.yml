# The validator command set, run on Node 20.
#
# These are exactly the commands `.harness/validators/yarn.json` grades, and
# every one of them must pass with no .env, no keys and no network beyond the
# package install.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable
      - run: yarn install --immutable

      # The template's own metadata. The harness cannot assert it, because the
      # CLI removes template.json from every project it generates.
      - name: template.json declares Next.js, Hardhat and Yarn
        run: |
          node -e '
            const t = require("./template.json");
            const d = t["create-scaffold-hbar"].defaults;
            const want = { frontend: "nextjs-app", solidityFramework: "hardhat", packageManager: "yarn" };
            for (const [k, v] of Object.entries(want)) if (d[k] !== v) throw new Error(`template.json defaults.${k} is ${d[k]}, expected ${v}`);
            if (t.name !== "product-passport") throw new Error(`template.json name is ${t.name}`);
            console.log("template.json ok");
          '

      - run: yarn lint
      - run: yarn next:check-types
      - run: yarn indexer:check-types
      - run: yarn hardhat:compile
      - run: yarn hardhat:test
      - run: yarn indexer:test
      - run: yarn next:build

  # No secret has ever been committed, and this keeps it that way: every
  # commit in the history, with the default rules. .gitleaks.toml exempts only
  # the vendored Yarn release, whose minified code trips a generic rule.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the whole history with gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --config .gitleaks.toml
